<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misi Teknisi AI</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1a29;height:100vh;overflow:hidden;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:#10263B}
#st{width:1280px;height:720px;position:absolute;left:50%;top:50%;background:#EEF2F5;display:flex;flex-direction:column}
.top{height:64px;background:#10263B;color:#fff;display:flex;align-items:center;gap:28px;padding:0 24px;font-size:22px}.top b{color:#FFC400;margin-right:auto}
.main{flex:1;padding:20px 40px;overflow:hidden;display:flex;flex-direction:column;gap:14px}
.foot{height:84px;display:flex;align-items:center;gap:20px;padding:0 40px;font-size:22px;font-weight:600;background:#fff;border-top:3px solid #10263B}.foot span{flex:1}.foot.g{color:#0B6B5E}.foot.r{color:#B42318}
button{font:inherit;font-size:22px;font-weight:700;min-height:52px;padding:0 28px;border:3px solid #10263B;border-radius:10px;background:#FFC400;color:#10263B;cursor:pointer}button:hover{background:#ffd54d}button.s{background:#fff}button:disabled{opacity:.4;cursor:default}
h1{font-size:64px;margin:0}h2{font-size:34px;margin:0}h3{font-size:24px;margin:0 0 8px}p,li{font-size:23px;line-height:1.45;margin:0}
.pr{background:#fff;border-left:8px solid #138A7A;padding:12px 18px;font-size:22px;line-height:1.4}
.ctr{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;background:#10263B;color:#fff}.ctr h1{color:#FFC400}.ctr p{max-width:820px}
.tray{display:flex;gap:14px;flex-wrap:wrap;min-height:112px}.card{background:#fff;border:3px solid #9AA7B4;border-radius:10px;padding:6px;cursor:grab}.card.sel{border-color:#138A7A;background:#D7F0EB}
.bins{display:flex;gap:30px;flex:1}.bin{flex:1;border:4px dashed #10263B;border-radius:14px;padding:12px;background:#fff;cursor:pointer}.mini{display:inline-block;transform:scale(.6);margin:-14px}
.row{background:#fff;border:3px solid #9AA7B4;border-radius:10px;padding:10px 18px;font-size:22px;cursor:pointer;display:flex;justify-content:space-between}.row.on{border-color:#B42318;background:#FDE8E6}.row.gd{border-color:#138A7A;background:#D7F0EB}
.opt{display:flex;gap:12px;margin-top:8px}.opt button{background:#fff}.opt button.gd{background:#138A7A;color:#fff}
.grid{display:flex;gap:24px;flex:1;align-items:center}.lvc{flex:1;background:#fff;border:3px solid #10263B;border-radius:14px;padding:18px;height:330px;display:flex;flex-direction:column;gap:10px}.lvc.lock{opacity:.45}
.star{color:#E0A800;font-size:34px}input[type=range]{width:420px;height:32px}.lab{font-size:22px;display:flex;align-items:center;gap:16px}table{border-collapse:collapse;font-size:20px;background:#fff}td,th{border:2px solid #9AA7B4;padding:4px 14px}
</style></head><body><div id="st"></div><script>
const st=document.getElementById('st');
function fit(){const k=Math.min(innerWidth/1280,innerHeight/720);st.style.transform='translate(-50%,-50%) scale('+k+')'}addEventListener('resize',fit);fit();
let A;try{A=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
function snd(ok){try{const o=A.createOscillator(),g=A.createGain();o.connect(g);g.connect(A.destination);o.frequency.value=ok?660:180;o.type=ok?'sine':'square';g.gain.value=.07;o.start();o.stop(A.currentTime+(ok?.15:.3))}catch(e){}}
const NAMES=['Kumpulkan Data','Bersihkan Data','Pilih Jenis AI','Latih Model','Terapkan & Etika'];
const S={scr:'home',lv:0,lives:3,score:0,stars:[0,0,0,0,0],open:1,mist:0,msg:'',ok:true,L:{}};
function fb(m,ok){S.msg=m;S.ok=ok;snd(ok)}
function bad(m){S.mist++;S.lives--;fb(m,false);if(S.lives<=0)S.scr='over';draw()}
function good(m,p=100){S.score+=p;fb(m,true);draw()}
function start(i){S.lv=i;S.scr='lv';S.lives=3;S.mist=0;S.msg='Ayo mulai! Baca petunjuk di atas.';S.ok=true;S.L=INIT[i]();draw()}
function done(){S.stars[S.lv]=Math.max(S.stars[S.lv],S.mist==0?3:S.mist==1?2:1);S.open=Math.min(5,Math.max(S.open,S.lv+2));S.scr=S.lv==4?'end':'done';draw()}
const part=t=>`<svg width="88" height="88" viewBox="0 0 90 90"><polygon points="45,6 80,25 80,65 45,84 10,65 10,25" fill="#9AA7B4" stroke="#3b4a59" stroke-width="3"/><circle cx="45" cy="45" r="16" fill="#EEF2F5" stroke="#3b4a59" stroke-width="3"/>${t=='crack'?'<polyline points="30,18 44,36 36,50 52,66 46,80" fill="none" stroke="#C53030" stroke-width="4"/>':''}${t=='dent'?'<ellipse cx="64" cy="34" rx="12" ry="9" fill="#4a5560"/>':''}</svg>`;
const INIT=[
()=>({it:['ok','crack','ok','dent','ok','crack','dent','ok'].map(t=>({t,b:null})),sel:null,fin:false}),
()=>({rows:[['Foto 01','Baik','Tampak mulus'],['Foto 02','Baik','Tampak retak jelas'],['Foto 03','Cacat','Retak di sisi kiri'],['Foto 03 (salinan)','Cacat','Retak di sisi kiri'],['Foto 05','Baik','Gambar buram, tidak terlihat'],['Foto 06','Cacat','Penyok di tepi']],p:[],fin:false}),
()=>({c:[['Memilah foto komponen menjadi Baik atau Cacat','Klasifikasi'],['Memperkirakan suhu mesin besok dari data harian','Regresi'],['Mengelompokkan pelanggan tanpa label apa pun','Klaster']],a:[null,null,null],fin:false}),
()=>({d:100,e:5,n:0,h:[],fin:false}),
()=>({i:0,ok:false,fin:false,q:[['Model akurat 98% pada data uji, tetapi 90% datanya dari shift pagi saja. Apa langkahmu?',['Langsung pasang di pabrik','Tambah data shift siang dan malam, lalu uji ulang','Naikkan jumlah epoch'],1,'Data lebih beragam membuat model adil di semua kondisi.'],['Kamera lini produksi ikut merekam wajah pekerja. Apa yang kamu lakukan?',['Simpan semua rekaman','Buramkan wajah, minta izin, simpan seperlunya','Jual rekaman ke pihak lain'],1,'Privasi pekerja wajib dijaga sesuai UU PDP.'],['Model sering menolak produk pemasok kecil karena datanya sedikit. Apa tindakanmu?',['Abaikan saja','Tambah data pemasok kecil dan audit hasil per pemasok','Hentikan kerja sama pemasok kecil'],1,'Audit per kelompok mengungkap bias yang tersembunyi.']]})];
function put(b){const L=S.L;if(L.sel==null){fb('Pilih komponen dulu, lalu pilih kotaknya.',false);return draw()}const x=L.it[L.sel];if((x.t=='ok')==(b=='ok')){x.b=b;L.sel=null;if(L.it.every(y=>y.b)){L.fin=true;return good('Semua komponen terpilah! Data berlabel siap dipakai melatih AI.')}good('Benar! Label yang tepat membuat AI belajar dengan benar.',20)}else bad(b=='ok'?'Salah: komponen ini punya cacat. Perhatikan retakan atau penyok.':'Salah: komponen ini mulus, jangan dilabeli Cacat.')}
function tog(i){const p=S.L.p,k=p.indexOf(i);k<0?p.push(i):p.splice(k,1);draw()}
function chk(){const p=S.L.p.slice().sort().join(),w='1,3,4';if(p==w){S.L.fin=true;return good('Data bersih! Label salah, duplikat, dan gambar buram sudah dibuang.')}const miss=[1,3,4].filter(i=>!S.L.p.includes(i)).length,extra=S.L.p.filter(i=>![1,3,4].includes(i)).length;bad(`Belum tepat: ${miss} data bermasalah terlewat, ${extra} data baik ikut dipilih. Cek label, duplikat, dan kejelasan gambar.`)}
function ans(i,t){const L=S.L;if(L.a[i])return;if(L.c[i][1]==t){L.a[i]=t;if(L.a.every(Boolean)){L.fin=true;return good('Ketiganya cocok! Jenis AI mengikuti bentuk masalahnya.')}good('Tepat!',30)}else bad('Kurang tepat. Klasifikasi = kategori, regresi = angka, klaster = kelompok tanpa label.')}
function calc(d,e){const f=1-Math.exp(-e/8),tr=Math.min(99,55+44*f),te=Math.max(40,55+40*f*(.6+.4*Math.min(1,d/200))-Math.max(0,e-30)*.9);return[Math.round(tr),Math.round(te)]}
function run(){const L=S.L,[tr,te]=calc(L.d,L.e);L.n++;L.h.push([L.d,L.e,tr,te]);L.h=L.h.slice(-4);L.r=[tr,te];if(te>=88&&tr-te<=6){L.fin=true;return good(`Model siap! Akurasi uji ${te}% dan stabil. Selesai dalam ${L.n} percobaan.`)}if(L.n>2)S.mist++;fb(tr<80?'Underfitting: model belum cukup belajar. Naikkan epoch atau tambah data.':tr-te>6?'Overfitting: model menghafal data latih. Kurangi epoch.':'Hampir! Tambah data atau atur epoch sedikit lagi.',false);draw()}
function pick(k){const L=S.L,q=L.q[L.i];if(L.ok)return;if(k==q[2]){L.ok=true;good('Keputusan tepat! '+q[3])}else bad('Kurang tepat. '+q[3])}
function nxt(){const L=S.L;L.ok=false;if(L.i==2){L.fin=true;S.msg='Semua kasus selesai!';return draw()}L.i++;S.msg='';draw()}
const V=[
()=>{const L=S.L;return `<div class="pr">Pemantik: bagaimana AI tahu mana produk cacat? Ia belajar dari contoh berlabel. Seret komponen ke kotak yang benar (atau ketuk komponen, lalu ketuk kotak).</div><div class="tray">${L.it.map((x,i)=>x.b?'':`<div class="card ${L.sel===i?'sel':''}" draggable="true" ondragstart="S.L.sel=${i}" onclick="S.L.sel=${i};draw()">${part(x.t)}</div>`).join('')}</div><div class="bins">${['ok','bad'].map(b=>`<div class="bin" ondragover="event.preventDefault()" ondrop="put('${b}')" onclick="put('${b}')"><h3>${b=='ok'?'Baik':'Cacat'}</h3>${L.it.filter(x=>x.b==b).map(x=>`<span class="mini">${part(x.t)}</span>`).join('')}</div>`).join('')}</div>`},
()=>{const L=S.L;return `<div class="pr">Pemantik: apa jadinya jika AI belajar dari data yang salah? Ketuk semua baris yang harus dibuang (label salah, duplikat, gambar buram), lalu tekan Periksa.</div>${L.rows.map((r,i)=>`<div class="row ${L.fin&&L.p.includes(i)?'gd':L.p.includes(i)?'on':''}" onclick="${L.fin?'':`tog(${i})`}"><span>${r[0]}</span><span>Label: ${r[1]}</span><span>${r[2]}</span></div>`).join('')}<div><button onclick="chk()" ${L.fin?'disabled':''}>Periksa data</button></div>`},
()=>{const L=S.L;return `<div class="pr">Pemantik: apakah semua masalah dijawab dengan jenis AI yang sama? Cocokkan tiap kasus pabrik dengan jenis AI yang tepat.</div>${L.c.map((c,i)=>`<div class="row" style="flex-direction:column;cursor:default"><b>${c[0]}</b><div class="opt">${['Klasifikasi','Regresi','Klaster'].map(t=>`<button class="${L.a[i]==t?'gd':''}" onclick="ans(${i},'${t}')">${t}</button>`).join('')}</div></div>`).join('')}`},
()=>{const L=S.L,r=L.r;return `<div class="pr">Tantangan: capai akurasi uji minimal 88% dengan selisih akurasi latih dan uji tidak lebih dari 6 poin. Atur variabel, lalu tekan Latih model. Bandingkan beberapa skenario!</div><div style="display:flex;gap:40px"><div style="display:flex;flex-direction:column;gap:14px"><div class="lab">Jumlah data <input type="range" min="20" max="500" step="10" value="${L.d}" oninput="S.L.d=+this.value;this.nextElementSibling.textContent=this.value"><b>${L.d}</b></div><div class="lab">Epoch <input type="range" min="1" max="60" value="${L.e}" oninput="S.L.e=+this.value;this.nextElementSibling.textContent=this.value"><b>${L.e}</b></div><div><button onclick="run()" ${L.fin?'disabled':''}>Latih model</button></div></div><svg width="440" height="190" viewBox="0 0 440 190"><line x1="0" x2="440" y1="${180-r_(88)}" y2="${180-r_(88)}" stroke="#138A7A" stroke-dasharray="6"/>${r?`<rect x="70" y="${180-r_(r[0])}" width="110" height="${r_(r[0])}" fill="#10263B"/><rect x="250" y="${180-r_(r[1])}" width="110" height="${r_(r[1])}" fill="${r[1]>=88?'#138A7A':'#C53030'}"/><text x="125" y="${172-r_(r[0])}" text-anchor="middle" font-size="20">Latih ${r[0]}%</text><text x="305" y="${172-r_(r[1])}" text-anchor="middle" font-size="20">Uji ${r[1]}%</text>`:'<text x="220" y="100" text-anchor="middle" font-size="20" fill="#555">Hasil tampil di sini</text>'}<text x="436" y="${176-r_(88)}" text-anchor="end" font-size="16" fill="#0B6B5E">target 88%</text></svg></div>${L.h.length?`<table><tr><th>Data</th><th>Epoch</th><th>Akurasi latih</th><th>Akurasi uji</th></tr>${L.h.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}%</td><td>${x[3]}%</td></tr>`).join('')}</table>`:''}`},
()=>{const L=S.L,q=L.q[L.i];return `<div class="pr">Studi kasus ${L.i+1} dari 3. Pikirkan dampaknya bagi pekerja, perusahaan, dan pelanggan sebelum memilih.</div><h2 style="font-size:30px">${q[0]}</h2>${q[1].map((o,k)=>`<button class="s" style="text-align:left;height:64px" onclick="pick(${k})">${o}</button>`).join('')}`}];
function r_(v){return Math.round((v-40)*2.2)}
function bar(){return `<div class="top"><b>Misi Teknisi AI</b><span>Level ${S.lv+1} dari 5: ${NAMES[S.lv]}</span><span>Nyawa ${'♥'.repeat(Math.max(0,S.lives))}${'♡'.repeat(Math.max(0,3-S.lives))}</span><span>Skor ${S.score}</span><button class="s" style="min-height:44px" onclick="S.scr='menu';draw()">Menu</button></div>`}
function stars(n){return `<span class="star">${'★'.repeat(n)}${'☆'.repeat(3-n)}</span>`}
function draw(){const s=S.scr,L=S.L;let h='';
if(s=='home')h=`<div class="ctr"><h1>Misi Teknisi AI</h1><p>Bangun sistem AI pendeteksi cacat produk di pabrik. Selesaikan 5 level dan jadilah teknisi AI andal!</p><div style="display:flex;gap:20px"><button onclick="S.scr='menu';draw()">Mulai</button><button class="s" onclick="S.scr='guide';draw()">Panduan</button></div></div>`;
else if(s=='guide')h=`<div class="top"><b>Panduan</b></div><div class="main"><h2>Cara bermain</h2><ul><li><b>Tujuan belajar:</b> kamu mampu menjelaskan alur membuat model AI dan mengenali bias serta etika AI.</li><li>Ada 5 level: data, pembersihan, jenis AI, pelatihan model, dan etika.</li><li>Kamu punya 3 nyawa per level. Jawaban salah mengurangi nyawa dan skor bonus.</li><li>Bintang diberikan dari jumlah kesalahan: 0 salah = 3 bintang.</li><li>Level yang sudah terbuka boleh diulang kapan saja lewat Menu.</li></ul><div style="margin-top:auto;display:flex;gap:16px"><button class="s" onclick="S.scr='home';draw()">Kembali</button><button onclick="S.scr='menu';draw()">Ke menu level</button></div></div>`;
else if(s=='menu')h=`<div class="top"><b>Pilih Level</b><span>Skor ${S.score}</span></div><div class="main"><div class="grid">${NAMES.map((n,i)=>`<div class="lvc ${i<S.open?'':'lock'}"><h3>Level ${i+1}</h3><p style="font-weight:700">${n}</p>${stars(S.stars[i])}<button style="margin-top:auto" ${i<S.open?'':'disabled'} onclick="start(${i})">${S.stars[i]?'Main lagi':'Main'}</button></div>`).join('')}</div><div><button class="s" onclick="S.scr='home';draw()">Kembali</button></div></div>`;
else if(s=='lv')h=bar()+`<div class="main">${V[S.lv]()}</div><div class="foot ${S.ok?'g':'r'}"><span>${S.msg}</span>${L.ok&&S.lv==4&&!L.fin?'<button onclick="nxt()">Berikutnya</button>':''}${L.fin?'<button onclick="done()">Selesaikan level</button>':''}</div>`;
else if(s=='done')h=`<div class="ctr"><h2 style="color:#FFC400">Level ${S.lv+1} selesai!</h2>${stars(S.stars[S.lv])}<p>Skor kamu: ${S.score}</p><div style="display:flex;gap:16px"><button class="s" onclick="S.scr='menu';draw()">Menu</button><button onclick="start(${S.lv+1})">Level berikutnya</button></div></div>`;
else if(s=='over')h=`<div class="ctr"><h2 style="color:#FFC400">Nyawa habis</h2><p>Tidak apa-apa, teknisi hebat belajar dari kesalahan. Coba lagi level ini!</p><div style="display:flex;gap:16px"><button class="s" onclick="S.scr='menu';draw()">Menu</button><button onclick="start(S.lv)">Ulangi level</button></div></div>`;
else if(s=='end'){const t=S.stars.reduce((a,b)=>a+b,0);h=`<div class="ctr"><h2 style="color:#FFC400">Misi selesai!</h2><p>Skor akhir ${S.score} dan ${t} dari 15 bintang. ${t>=13?'Teknisi AI andal!':t>=9?'Kerja bagus, terus asah lagi!':'Ulangi level agar bintangmu bertambah.'}</p><p>Konsep yang kamu kuasai: pelabelan data, pembersihan data, jenis AI, overfitting, dan etika AI.</p><p>Refleksi: bagian proses AI mana yang paling berpengaruh pada keadilan hasilnya? Mengapa?</p><div style="display:flex;gap:16px"><button class="s" onclick="S.scr='menu';draw()">Menu</button><button onclick="S.scr='kredit';draw()">Kredit</button></div></div>`}
else h=`<div class="top"><b>Kredit</b></div><div class="main"><h2>Informasi kreator</h2><p>Kreator: [isi nama kreator dan sekolah di sini]</p><p>Ilustrasi komponen dibuat dengan kode (SVG) dan efek suara dengan Web Audio API; tanpa aset eksternal.</p><div style="margin-top:auto"><button onclick="S.scr='home';draw()">Ke laman muka</button></div></div>`;
st.innerHTML=h}
draw();
</script></body></html>
